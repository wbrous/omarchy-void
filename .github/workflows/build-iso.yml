name: Build ISO and Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 4.0.0-alpha.2)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: true

concurrency:
  group: build-iso
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout omarchy-void
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          submodules: recursive

      - name: Build Hyprland packages inside Void container
        run: |
          set -euo pipefail

          docker run --privileged --rm -i \
            -v "${{ github.workspace }}:/src:rw" \
            ghcr.io/void-linux/void-glibc:latest \
            /bin/sh -s <<'VOID_SCRIPT'
          set -eu

          # Update xbps and sync repos
          xbps-install -y -Su xbps
          xbps-install -y -Su

          # Install build tools (util-linux for getopt, shadow for useradd)
          xbps-install -y git bash sudo tar gzip xz \
            base-devel cmake meson ninja pkg-config \
            util-linux shadow

          # Create non-root builder user (xbps-src refuses to run as root)
          useradd -m -s /bin/bash builder

          # Clone void-packages for xbps-src infrastructure
          git clone --depth 1 https://github.com/void-linux/void-packages.git /void-packages

          # Copy ONLY the templates that are not in Void, plus some that need
          # custom compilation (like Makrennel libspng).
          # We SKIP hyprutils, tomlplusplus, and hyprwayland-scanner because
          # Void official repos have newer/correctly-split versions of them.
          for dir in /src/hyprland-void/srcpkgs/*/; do
            pkg=$(basename "$dir")
            # Skip symlinks (e.g. hyprland-devel -> hyprland)
            if [ -L "${dir%/}" ]; then
              cp -a "${dir%/}" "/void-packages/srcpkgs/$pkg"
              continue
            fi
            # Skip packages Void already provides appropriately
            if [ -d "/void-packages/srcpkgs/$pkg" ] || [ "$pkg" = "sdbus-cpp" ]; then
              echo "Skipping $pkg (using Void's version instead)"
              continue
            fi
            cp -r "$dir" "/void-packages/srcpkgs/$pkg"
          done

          # Patch Makrennel makedepends to correctly reference Void -devel packages
          sed -E -i 's/\btomlplusplus\b(-devel)?/tomlplusplus-devel/g' /void-packages/srcpkgs/*/template
          sed -E -i 's/\bsdbus-cpp\b(-devel)?/sdbus-c++-devel/g' /void-packages/srcpkgs/*/template

          # Append submodule shlibs ONLY for the packages we actually copied.
          # Blindly appending all of them breaks xbps-src pkglint for packages like hyprutils.
          while read -r line; do
            pkgname=$(echo "$line" | awk '{print $2}' | sed 's/-[0-9].*//')
            if [ -n "$pkgname" ] && [ -d "/void-packages/srcpkgs/$pkgname" ] && [ -d "/src/hyprland-void/srcpkgs/$pkgname" ]; then
              echo "$line" >> /void-packages/common/shlibs
            fi
          done < /src/hyprland-void/common/shlibs

          chown -R builder:builder /void-packages
          mkdir -p /src/local-repo
          chown builder:builder /src/local-repo

          # Run the entire build as the builder user in one session
          # so hostdir/binpkgs is available for dependency resolution.
          su -s /bin/bash builder -c "
            cd /void-packages
            ./xbps-src binary-bootstrap

            # Build in dependency order — full Hyprland ecosystem
            for pkg in \
              libspng \
              hyprland-protocols glaze \
              hyprlang hyprgraphics hyprcursor \
              aquamarine hyprland \
              hypridle hyprlock hyprpaper \
              hyprpolkitagent hyprsunset hyprsysteminfo \
              hyprland-qt-support hyprland-qtutils \
              xdg-desktop-portal-hyprland; do
              if [ -d srcpkgs/\$pkg ]; then
                echo \"=== Building \$pkg ===\"
                ./xbps-src -j\$(nproc) pkg \$pkg || {
                  echo \"ERROR: \$pkg build failed\"
                  exit 1
                }
              fi
            done

            # Collect built packages into local repo
            for pattern in aquamarine glaze hypr libspng xdg-desktop-portal-hyprland; do
              cp hostdir/binpkgs/\${pattern}*.xbps /src/local-repo/ 2>/dev/null || true
            done
            cd /src/local-repo
            xbps-rindex -a *.xbps
            echo \"=== Local repo: \$(ls -1 *.xbps | wc -l) packages ===\"
          "
          VOID_SCRIPT

      - name: Upload built packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyprland-packages
          path: ${{ github.workspace }}/local-repo/
          retention-days: 1

  build-iso:
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout omarchy-void
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          submodules: recursive

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: hyprland-packages
          path: ./local-repo

      - name: Build ISO inside Void container
        env:
          ISO_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          docker run --privileged --rm -i \
            -v "${{ github.workspace }}:/src:rw" \
            -e ISO_VERSION="$ISO_VERSION" \
            -e MKLIVE_DIR=/void-mklive \
            -e OMARCHY_MIRROR="https://repo-fastly.voidlinux.org/current" \
            -e HYPRLAND_REPO="file:///src/local-repo" \
            ghcr.io/void-linux/void-glibc:latest \
            /bin/sh -s <<'VOID_SCRIPT'
          set -eu

          # Update xbps and sync repos
          xbps-install -y -Su xbps
          xbps-install -y -Su

          # Install build deps for mklive
          xbps-install -y git bash sudo tar gzip xz \
            squashfs-tools liblz4 xorriso syslinux

          # Reindex local repo inside container
          cd /src/local-repo
          xbps-rindex -a *.xbps 2>/dev/null || true
          cd /src

          # Clone void-mklive
          git clone --depth 1 https://github.com/void-linux/void-mklive /void-mklive

          # Build ISO — HYPRLAND_REPO is passed through to build.sh
          OUTPUT="/src/omarchy-void-${ISO_VERSION}-x86_64.iso"
          bash iso/build.sh "$OUTPUT"
          VOID_SCRIPT

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-void-iso
          path: ${{ github.workspace }}/omarchy-void-*.iso
          retention-days: 1

  draft-release:
    needs: build-iso
    runs-on: ubuntu-latest
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: omarchy-void-iso
          path: ./iso

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Omarchy-Void ${{ github.event.inputs.version }}
          body: |
            ## Omarchy-Void ${{ github.event.inputs.version }}

            Built from [dev branch](https://github.com/${{ github.repository }}/tree/dev)
            at commit `${{ github.sha }}`.

            ### Installation
            1. Download the ISO
            2. Flash to a USB drive (`dd if=*.iso of=/dev/sdX bs=4M status=progress`)
            3. Boot from USB and follow installer prompts

            > This is a **draft** release. Review before publishing.
          draft: true
          prerelease: ${{ github.event.inputs.prerelease }}
          files: ./iso/*.iso
